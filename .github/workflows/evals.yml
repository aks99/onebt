name: Prompt evals (Promptfoo, blueprint 13.15)
on:
  push:
    paths: ["app/packages/prompts/**", "app/packages/evals/**", ".github/workflows/evals.yml"]
  workflow_dispatch:
jobs:
  structure:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: node packages/prompts/scripts/check-prompts.mjs
      - run: node packages/evals/scripts/check-suite.mjs
  evals:
    needs: structure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/packages/evals
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Secrets cannot gate a job in its "if"; the step checks instead. Without the key the run is skipped, not failed.
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "present=false" >> "$GITHUB_OUTPUT"; echo "ANTHROPIC_API_KEY is not set in the repository secrets; the model run is skipped."; else echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - name: Run every suite; a regression fails the job and blocks deploy
        if: steps.key.outputs.present == 'true'
        run: bash scripts/run-all.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: promptfoo-results
          path: app/packages/evals/results/*.json
