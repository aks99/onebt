- description: 'script hook from finalized outline 1: Safety checklists fail when the most jun'
  vars:
    section_id: s1
    kind: hook
    target_words: 150
    writing_sample: I write short. I say what I saw. I do not dress it up.
    outline_json:
      sections:
      - id: s1
        kind: hook
        purpose: a specific moment
        talking_points:
        - id: p1
          kind: story
          text: the room at 3:04 where nobody spoke
          source: brief
          consent: pseudonymized
        target_seconds: 60
        target_words: 150
        ending_point: false
      - id: s2
        kind: idea
        purpose: state the idea
        talking_points:
        - id: p2
          kind: claim
          text: Safety checklists fail when the most junior person in the room cannot stop it
          source: idea_card
          consent: not_a_story
        - id: p3
          kind: claim
          text: 'the belief it challenges: Reading a checklist aloud makes a team safe'
          source: idea_card
          consent: not_a_story
        target_seconds: 60
        target_words: 150
        ending_point: false
      - id: s5
        kind: close
        purpose: new bliss and one action
        talking_points:
        - id: p9
          kind: claim
          text: Ask the quietest person first
          source: idea_card
          consent: not_a_story
        target_seconds: 60
        target_words: 150
        ending_point: true
    prior_text: ''
    profile:
      segment: coach
  assert:
  - type: is-json
  - type: javascript
    value: const o=JSON.parse(output); const n=o.text.trim().split(/\s+/).length; n>=120 && n<=185
  - type: javascript
    value: const o=JSON.parse(output); const ids=o.covered_point_ids.concat(o.uncovered.map(u=>u.id)); ["p1"].every(id=>ids.includes(id))
  - type: javascript
    value: const o=JSON.parse(output); !/(I have given this talk|I've delivered this talk|spoken on this topic many times|my
      book|available on Amazon|learn more at)/i.test(o.text)
  - type: javascript
    value: '!output.includes(String.fromCharCode(0x2014)) && !/[A-Za-z]!/.test(JSON.parse(output).text)'
  - type: javascript
    value: const t=JSON.parse(output).text.trim(); !/^(hi|hello|good (morning|evening)|thank you|today I)/i.test(t)
