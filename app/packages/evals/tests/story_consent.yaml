- description: 'story consent 1: named_with_permission'
  vars:
    slot_minutes: 10
    target_wpm: 150
    word_budget: 1450
    structure_template: story_spine
    idea_brief:
      idea: Safety checklists fail when the most junior person in the room cannot stop it
      belief: Reading a checklist aloud makes a team safe
      story: The story is about my colleague Priya, who gave me permission to use her name.
      evidence: 40 teams observed over two years; WHO programme data (needs source)
      action: Ask the quietest person first
      why_me: I have done this work for a decade.
    idea_json:
      throughline: Safety checklists fail when the most junior person in the room cannot stop it
    expansion_json: {}
    profile:
      segment: coach
  assert:
  - type: is-json
  - type: javascript
    value: const o=JSON.parse(output); const stories=o.sections.flatMap(s=>s.talking_points).filter(p=>p.kind==='story');
      stories.length>0 && stories.every(p=>p.consent==='named_with_permission')
