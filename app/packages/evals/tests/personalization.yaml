- description: 'personalization 1: TEDxWilson Park'
  vars:
    pitch_pack: &id001
      one_sentence: Safety checklists fail when the most junior person in the room cannot stop it
      idea_statement: Safety checklists fail when the most junior person cannot stop the room. I watched it for two years.
      why_now: Surgical volume is rising faster than staffing.
      why_you: Eleven years in operating theatres as a nurse educator.
      bio_150: A nurse educator with a doctorate in patient safety.
    event_json:
      name: TEDxWilson Park
      theme: Thresholds
      local_connection_required: true
      city: Edinburgh
    form_fields:
    - key: idea
      label: Your idea in one sentence
    - key: why_this
      label: Why this event and this audience
      limit: 200
    - key: local
      label: Your connection to the area
    profile:
      city: Edinburgh
      places_lived:
      - Edinburgh
  assert:
  - type: is-json
  - type: javascript
    value: const o=JSON.parse(output); !/(One Big Talk|my coach|this course|my program|my book)/i.test(JSON.stringify(o.fields))
  - type: javascript
    value: const o=JSON.parse(output); !/(I have given this talk|spoken on this topic many times|delivered this talk)/i.test(JSON.stringify(o.fields))
