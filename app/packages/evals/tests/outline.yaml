- description: 'outline from brief 1: Safety checklists fail when the most jun'
  vars:
    slot_minutes: 10
    target_wpm: 150
    word_budget: 1450
    structure_template: ted_four_beat
    idea_brief:
      idea: 'Safety checklists fail when the most junior person in the room cannot stop it. I mean this literally: reading
        a checklist aloud makes a team safe is the belief most people hold, and I have watched it fail.'
      belief: Reading a checklist aloud makes a team safe. The people who disagree are surgeons who see the timeout as theatre,
        and their reason is that the current way is cheaper and familiar.
      story: 'One specific moment: in 2016 I stood in a room where everyone could see the problem and nobody spoke. I remember
        the hum of the monitor and the clock at 3:04. My sister later told me what it cost them.'
      evidence: 40 teams observed over two years; WHO programme data (needs source). I also have my own count from two years
        of notes.
      action: Ask the quietest person first
      why_me: I have done this work for over a decade and have never shared this idea from a stage.
    idea_json:
      throughline: Safety checklists fail when the most junior person in the room cannot stop it
      belief_challenged: Reading a checklist aloud makes a team safe
      antagonist: Surgeons who see the timeout as theatre
      evidence_notes: 40 teams observed over two years; WHO programme data (needs source)
      audience_action: Ask the quietest person first
