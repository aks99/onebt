- description: prior stages 1
  vars:
    prior_stages:
    - id: e1
      month: 3
      year: 2025
      city: Mumbai
      organization: Hospital leadership summit
      audience_size: 400
      topic: Leading hospital teams
    - id: e2
      month: 9
      year: 2024
      city: Pune
      organization: Nurses' association
      audience_size: 60
      topic: Night-shift staffing
    idea_json: &id001
      throughline: Safety checklists fail when the most junior person in the room cannot stop it
      belief_challenged: Reading a checklist aloud makes a team safe
  assert:
  - type: is-json
  - type: javascript
    value: const o=JSON.parse(output); !/(this talk|this idea|this topic)/i.test(o.experience_sentences)
  - type: javascript
    value: const o=JSON.parse(output); /first/i.test(o.first_time_sentence)
  - type: javascript
    value: const o=JSON.parse(output); !/gave a presentation/i.test(o.experience_sentences)
  - type: javascript
    value: const o=JSON.parse(output); o.overlap_warning.length===0
