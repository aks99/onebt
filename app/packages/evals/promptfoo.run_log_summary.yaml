description: 'One Big Talk eval: run_log_summary (blueprint 13.15)'
prompts:
- file://prompts/render.mjs:run_log_summary
providers:
- id: anthropic:messages:claude-haiku-5-5
  label: run_log_summary (haiku)
  config:
    max_tokens: 600
    temperature: 0
    tools:
    - name: return_result
      description: Return the result in the required structure.
      input_schema:
        type: object
        additionalProperties: false
        properties:
          trend:
            type: string
          next_drill:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                enum:
                - read_cover_recite
                - cue_cards
                - blank_fill
                - chaining
              beat_ids:
                type: array
                items:
                  type: string
              why:
                type: string
            required:
            - kind
            - beat_ids
            - why
          timing_advice:
            type: string
        required:
        - trend
        - next_drill
        - timing_advice
    tool_choice:
      type: tool
      name: return_result
defaultTest:
  options:
    transform: 'typeof output === ''object'' ? JSON.stringify(output) : output'
tests: file://tests/run_log_summary.yaml
