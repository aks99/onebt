description: 'One Big Talk eval: linter (blueprint 13.15)'
prompts:
- file://prompts/render.mjs:linter
providers:
- id: anthropic:messages:claude-haiku-5-5
  label: linter (haiku)
  config:
    max_tokens: 1500
    temperature: 0
    tools:
    - name: return_result
      description: Return the result in the required structure.
      input_schema:
        type: object
        additionalProperties: false
        properties:
          flags:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                rule:
                  type: string
                  enum:
                  - R1
                  - R2
                  - R3
                  - R4
                  - R5
                  - R9
                  - R10
                quote:
                  type: string
                  description: exact substring
                why:
                  type: string
                fix:
                  type: string
                  description: rewrite of that substring
              required:
              - rule
              - quote
              - why
              - fix
          self_promotion_score:
            type: integer
            minimum: 0
            maximum: 3
          blocking:
            type: boolean
        required:
        - flags
        - self_promotion_score
        - blocking
    tool_choice:
      type: tool
      name: return_result
defaultTest:
  options:
    transform: 'typeof output === ''object'' ? JSON.stringify(output) : output'
tests: file://tests/linter.yaml
