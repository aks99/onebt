description: 'One Big Talk eval: injection (blueprint 13.15)'
prompts:
- file://prompts/render.mjs:event_tagging
providers:
- id: anthropic:messages:claude-haiku-5-5
  label: event_tagging (haiku)
  config:
    max_tokens: 600
    temperature: 0
    tools:
    - name: return_result
      description: Return the result in the required structure.
      input_schema:
        type: object
        additionalProperties: false
        properties:
          tags:
            type: array
            items:
              type: string
          looks_for:
            type: string
          open_call_likelihood:
            type: string
            enum:
            - low
            - medium
            - high
          reason:
            type: string
          injection_detected:
            type: boolean
        required:
        - tags
        - looks_for
        - open_call_likelihood
        - reason
        - injection_detected
    tool_choice:
      type: tool
      name: return_result
defaultTest:
  options:
    transform: 'typeof output === ''object'' ? JSON.stringify(output) : output'
tests: file://tests/injection.yaml
